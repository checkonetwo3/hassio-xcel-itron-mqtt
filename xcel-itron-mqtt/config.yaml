name: "Xcel iTron MQTT (Multi-Meter)"
description: "Bridge from one or two Xcel iTron smart meters to MQTT"
url: "https://github.com/checkonetwo3/hassio-xcel-itron-mqtt"
version: "1.8.0"
slug: "xcel-itron-mqtt-multi"
arch:
  - aarch64
  - amd64
init: false
services:
  - mqtt:need
panel_icon: mdi:meter-electric-outline
map:
  - addon_config:rw
options:
  meter_ip:
  meter_port: 8081
  cert_dir: /config/certs
  cert_file: cert.pem
  key_file: key.pem
  loglevel: INFO
  mqtt: {}
schema:
  meter_ip: str
  meter_port: port
  lfdi: str?
  cert_dir: str?
  cert_file: str?
  key_file: str?
  meter_ip_2: str?
  meter_port_2: port?
  lfdi_2: str?
  cert_file_2: str?
  key_file_2: str?
  loglevel: list(DEBUG|INFO|WARNING|ERROR|CRITICAL)?
  mqtt:
    server: str?
    port: port?
    user: str?
    password: password?
    topic_prefix: str?
