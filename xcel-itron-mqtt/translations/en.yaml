---
configuration:
  meter_ip:
    name: Meter 1 IP
    description: The IP address of your first meter
  meter_port:
    name: Meter 1 Port
    description: The port of your first meter (default 8081)
  cert_dir:
    name: Certificate Directory
    description: The directory to store the certificate and key (default /config/certs)
  cert_file:
    name: Meter 1 Certificate File
    description: The name of the certificate file for meter 1 (default cert.pem)
  key_file:
    name: Meter 1 Key File
    description: The name of the key file for meter 1 (default key.pem)
  meter_ip_2:
    name: Meter 2 IP (optional)
    description: The IP address of your second meter (leave empty if you only have one meter)
  meter_port_2:
    name: Meter 2 Port (optional)
    description: The port of your second meter (default 8081)
  cert_file_2:
    name: Meter 2 Certificate File (optional)
    description: The name of the certificate file for meter 2 (default cert2.pem)
  key_file_2:
    name: Meter 2 Key File (optional)
    description: The name of the key file for meter 2 (default key2.pem)
  mqtt:
    name: MQTT Server
    description: >-
      MQTT server configuration (do not configure this if you are using the Mosquitto broker addon). Only server is required.
      Valid options are:
      server: The MQTT server address
      port: The port of the MQTT server
      user: The username for the MQTT server
      password: The password for the MQTT server
      topic_prefix: The prefix for the MQTT topics
